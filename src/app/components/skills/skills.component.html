<section id="skills" class="section skills">
  <div class="section-inner">
    <h2 class="skills__title" appReveal>{{ content().ui.skillsTitle }}</h2>

    <div class="skills__grid" appReveal>
      @for (group of content().skillGroups; track group.label) {
        <div class="skills__group">
          <h3>{{ group.label }}</h3>
          <div class="skills__tags">
            @for (item of group.items; track item) {
              <span>{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
